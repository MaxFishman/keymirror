name: Release

# Builds KeyMirror.app, zips it, and publishes a GitHub Release so installed
# apps can auto-update.
#
# NOTE: GitHub-hosted macOS runners are not currently available to this account
# (macos-14 reports "not supported"; macos-13 jobs sit queued). Until that's
# resolved, cut releases locally with `./release.sh <version>` instead. This
# workflow is kept ready and set to manual (workflow_dispatch) so it doesn't
# fire failing/queued runs — flip it back to `push: tags` once runners work.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    # macos-13 (Intel) is the most broadly-available hosted runner; we
    # cross-compile to arm64 so the result runs on Apple Silicon Macs.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Derive version from tag
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Build KeyMirror.app (arm64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ github.run_number }}
          ARCH: arm64
        run: ./build-app.sh

      - name: Zip the app bundle
        run: ditto -c -k --keepParent dist/KeyMirror.app dist/KeyMirror.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release create "${TAG}" \
            dist/KeyMirror.zip \
            --title "keymirror ${TAG}" \
            --generate-notes
